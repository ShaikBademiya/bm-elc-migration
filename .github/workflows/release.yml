name: Release

# TRD-002 (:123, :511, :603-625): release.yml is dispatched with a bump type,
# computes the next semantic version, tags it, and publishes the versioned
# artifacts behind a GitHub `prod` environment approval gate.
#
# Three workflows, three jobs:
#   deploy.yml   continuous delivery to whichever environment a branch maps to
#   release.yml  cuts a tagged, immutable version and PUBLISHES it - this file
#   promote.yml  deploys an already-published version to an environment
#
# release.yml deliberately does NOT deploy. Under build-once-deploy-many there
# must be exactly one path to prod, and that is promote.yml, which verifies the
# version exists before touching anything and records what it deployed. A second
# path here would reintroduce the drift the whole model exists to remove.
#
# This workflow publishes only. It claims no environment, because it deploys to
# none - recording a prod deployment for a job that never touches prod made the
# deployment history lie.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Compute the version and build, but publish nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Shares deploy.yml's group: both write to the same Composer prefixes, so a
# release and a branch deploy must never interleave. ref_name keys it to the
# branch the release is cut from.
concurrency:
  group: composer-deploy-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

env:
  # Must match deploy.yml, or a release would write to different prefixes than
  # continuous delivery does.
  DOMAIN: udp
  # Must match deploy.yml and promote.yml, or a release publishes the bundle
  # somewhere promote.yml does not look.
  BUNDLE_REPO: bm-udp-artifacts

jobs:
  # release.yml previously published with no gates at all. Because promote.yml
  # deploys an already-published bundle without re-validating it, the whole
  # release -> promote path to prod bypassed every check deploy.yml enforces:
  # a release could tag, publish and promote code that fails lint or tests.
  # These run before the tag is cut, so a failing release leaves no tag behind.
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  artifacts-valid:
    name: Artifact validation gate
    uses: ./.github/workflows/validate-dags.yml
    permissions:
      contents: read

  tag:
    name: Compute version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, artifacts-valid]

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      has_databricks_bundle: ${{ steps.detect.outputs.has_databricks_bundle }}

    steps:
      # Cutting a release from anywhere permanently claims a version number for
      # whatever happened to be on that ref. master and main are retained but
      # dead, and a release cut from either would publish stale code under a
      # fresh tag that promote.yml would then deploy to prod. deploy.yml already
      # refuses any branch but dev and prod; this applies the same rule.
      #
      # A step rather than a job-level `if:` on purpose: a false job condition
      # skips the job and every job downstream of it, so the run goes green
      # having released nothing. This fails, visibly.
      - name: Refuse to release from a branch that is not dev or prod
        run: |
          case "${GITHUB_REF_NAME}" in
            dev | prod) echo "Releasing from '${GITHUB_REF_NAME}'." ;;
            *)
              echo "::error::Releases are cut from 'dev' or 'prod' only; got '${GITHUB_REF_NAME}'."
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Detected here rather than with hashFiles() in the Databricks job's if:.
      # hashFiles resolves against the workspace, which is not checked out when a
      # job-level condition is evaluated, so it would always be empty and the job
      # would never run - failing silently instead of staying dormant.
      - name: Detect Databricks bundle
        id: detect
        run: |
          if [ -f databricks.yml ]; then
            echo "has_databricks_bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_databricks_bundle=false" >> "$GITHUB_OUTPUT"
          fi
          echo "databricks.yml present: $([ -f databricks.yml ] && echo yes || echo no)"

      - name: Compute next version
        id: bump
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          [ -z "$LATEST" ] && LATEST="v0.0.0"

          MAJOR=$(echo "${LATEST#v}" | cut -d. -f1)
          MINOR=$(echo "${LATEST#v}" | cut -d. -f2)
          PATCH=$(echo "${LATEST#v}" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Previous: ${LATEST}  ->  next: v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  publish:
    name: Publish versioned artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tag

    steps:
      # Check out the tag itself. setuptools-scm reads the version from the
      # nearest tag, so building the tagged commit is what produces a clean
      # X.Y.Z rather than a .devN+g<sha>.
      # On a real release the tag exists and building it is what yields a clean
      # X.Y.Z. On a dry run the tag was deliberately not pushed, so checking it
      # out fails with "a branch or tag with the name 'vX.Y.Z' could not be
      # found" - fall back to the dispatched ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.dry_run && github.ref || needs.tag.outputs.tag }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Build wheel
        run: uv build --wheel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel
          path: dist/*.whl

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: ${{ !inputs.dry_run }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        if: ${{ !inputs.dry_run }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Publish wheel to Artifact Registry
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: oauth2accesstoken
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_PYTHON_REPOSITORY }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          pip install twine keyring keyrings.google-artifactregistry-auth
          set -euo pipefail

          # Artifact Registry rejects re-uploading an existing version, and its
          # API does not implement twine's --skip-existing (twine 7 raises
          # UnsupportedConfiguration against an AR repository). Ask the registry
          # directly instead - this is idempotent without swallowing real errors.
          if gcloud artifacts versions describe "${VERSION}" \
               --package=amf \
               --repository="${REPOSITORY}" \
               --location="${REGION}" \
               --project="${PROJECT_ID}" >/dev/null 2>&1; then
            echo "amf ${VERSION} is already published; nothing to upload."
            exit 0
          fi

          export TWINE_PASSWORD="$(gcloud auth print-access-token)"

          python -m twine upload --verbose \
            --repository-url "https://${REGION}-python.pkg.dev/${PROJECT_ID}/${REPOSITORY}/" \
            dist/*.whl

      - name: Build and push release image
        if: ${{ !inputs.dry_run }}
        env:
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_DOCKER_REPOSITORY }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/amf"

          # Tagged with the release version and with the commit sha, so an image
          # can always be traced back to the code that produced it.
          docker build -t "${BASE}:${VERSION}" -t "${BASE}:${GITHUB_SHA}" .
          docker push "${BASE}:${VERSION}"
          docker push "${BASE}:${GITHUB_SHA}"

      # A release must publish the artifact bundle too, or there is nothing for
      # promote.yml to deploy at this version. A tag produces a clean X.Y.Z, so
      # no character substitution is needed here.
      - name: Publish artifact bundle
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
        run: bash .github/scripts/publish_bundle.sh "${VERSION}"

      - name: Summarise what to promote
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          {
            echo "### Released \`${VERSION}\`"
            echo ""
            echo "Wheel, image and artifact bundle are published."
            echo ""
            echo "Nothing has been deployed. Run the **Promote** workflow with"
            echo "version \`${VERSION}\` and the target environment to deploy it."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-databricks:
    name: Deploy Databricks bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tag, publish]

    environment:
      name: prod

    # TRD-002 (:510, :580-588) includes a DABs deploy in the release path.
    # There is no databricks.yml in this repo yet, so this job stays dormant and
    # activates automatically the moment the bundle is added.
    if: ${{ !inputs.dry_run && needs.tag.outputs.has_databricks_bundle == 'true' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Deploy bundle to prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t prod

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tag, publish]
    if: ${{ !inputs.dry_run }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-wheel
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.tag.outputs.tag }}" \
            dist/*.whl \
            --title "${{ needs.tag.outputs.tag }}" \
            --generate-notes
