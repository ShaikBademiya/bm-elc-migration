name: Deploy

on:
  push:
    branches:
      - master # Environment: dev
      - ust # Environment: ust
      - sit # Environment: sit
      - main # Environment: prod
    paths:
      - 'amf/core/**'
      - 'artifacts/configs/**'
      - 'artifacts/jobs/**'
      - 'artifacts/dags/**'
      - 'artifacts/dbt/**'
      - 'databricks.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every artifact this repo deploys is written under a prefix owned by this
  # domain, so a destructive sync can never reach another domain's files on a
  # shared Composer bucket. Matches the dags/udp/ convention in TRD-002 :569 and
  # the dags/${domain_name}/ convention already used by etp-etl-core.
  DOMAIN: udp

# Two pushes in quick succession would otherwise run overlapping rsyncs against
# the same GCS prefixes. Queue rather than cancel: a half-finished deploy that
# gets cancelled mid-sync leaves the bucket in an unknown state.
# Least privilege. id-token is requested so the auth step can move to Workload
# Identity Federation without restructuring this workflow; nothing here needs
# write access to repository contents.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}

    steps:
      - name: Resolve deployment environment
        id: set-env
        run: |
          case "${GITHUB_REF_NAME}" in
            master)
              ENVIRONMENT="dev"
              ;;
            ust)
              ENVIRONMENT="ust"
              ;;
            sit)
              ENVIRONMENT="sit"
              ;;
            main)
              ENVIRONMENT="prod"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

          echo "Resolved deployment environment: ${ENVIRONMENT}"

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"


  changes:
    runs-on: ubuntu-latest
    needs: setup

    environment:
      name: ${{ needs.setup.outputs.environment }}

    outputs:
      python: ${{ steps.filter.outputs.python }}
      dags: ${{ steps.filter.outputs.dags }}
      dbt: ${{ steps.filter.outputs.dbt }}
      configs_jobs: ${{ steps.filter.outputs.configs_jobs }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Code only. artifacts/configs and artifacts/jobs are data and are
            # covered by the configs_jobs filter below. Including them here
            # rebuilt and republished a byte-identical wheel and image on every
            # config-only change - the config/code coupling ADR-006 Decision 2
            # exists to remove.
            python:
              - 'amf/core/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'databricks.yml'

            dags:
              - 'artifacts/dags/**'

            dbt:
              - 'artifacts/dbt/**'

            configs_jobs:
              - 'artifacts/configs/**'
              - 'artifacts/jobs/**'

  build-wheel:
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: needs.changes.outputs.python == 'true'

    environment:
      name: ${{ needs.setup.outputs.environment }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Set package version
        id: version
        run: |
            VERSION="0.0.${GITHUB_RUN_NUMBER}"

            echo "Package version: ${VERSION}"

            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml

            echo "Updated pyproject.toml:"
            grep '^version' pyproject.toml

      - name: Build wheel
        run: uv build --wheel

      # Optional: Inspect the generated wheel files for debugging purposes
      # - name: Inspect generated wheel
      #   run: |
      #       echo "Generated wheel files:"
      #       ls -lh dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-wheel
          path: dist/*.whl

  deploy-artifact-registry-python:
    runs-on: ubuntu-latest
    needs: [setup, build-wheel]

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-wheel
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: |
          python -m pip install --upgrade pip
          pip install twine keyring keyrings.google-artifactregistry-auth

      - name: Upload wheel to Artifact Registry
        env:
          TWINE_USERNAME: oauth2accesstoken
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_PYTHON_REPOSITORY }}
        run: |
          export TWINE_PASSWORD="$(gcloud auth print-access-token)"

          python -m twine upload --verbose \
            --repository-url "https://${REGION}-python.pkg.dev/${PROJECT_ID}/${REPOSITORY}/" \
            dist/*.whl

  deploy-artifact-registry-docker:
    runs-on: ubuntu-latest

    needs: [setup, build-wheel]


    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:

      - uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: pipeline-wheel
          path: dist

      - name: Verify wheel
        run: |
          echo "Wheel used for Docker image:"
          ls -lh dist/


      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2


      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            ${{ secrets.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev


      - name: Build Docker image
        env:
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_DOCKER_REPOSITORY }}
          VERSION: ${{ needs.build-wheel.outputs.version }}

        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/amf"

          # 0.0.<run_number> carries no link back to the code that produced it,
          # so the commit sha goes on as a second tag. Without it there is no
          # way to answer "which commit is running here".
          echo "Building ${BASE}:${VERSION} (also tagged ${GITHUB_SHA})"

          docker build \
            -t "${BASE}:${VERSION}" \
            -t "${BASE}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        env:
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_DOCKER_REPOSITORY }}
          VERSION: ${{ needs.build-wheel.outputs.version }}

        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/amf"

          echo "Pushing ${BASE}:${VERSION} and ${BASE}:${GITHUB_SHA}"

          docker push "${BASE}:${VERSION}"
          docker push "${BASE}:${GITHUB_SHA}"

  deploy-dags:
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: needs.changes.outputs.dags == 'true'

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Namespaced under dags/<domain>/ so the destructive -d below can only ever
      # delete this domain's DAGs. Against a shared Composer bucket an
      # un-namespaced `rsync -d` at dags/ would delete every other domain's tree.
      - name: Sync DAGs to Composer
        run: |
          gsutil -m rsync -r -d \
            artifacts/dags/ \
            gs://${{ secrets.COMPOSER_BUCKET }}/dags/${{ env.DOMAIN }}/

  deploy-dbt:
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: needs.changes.outputs.dbt == 'true'

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # data/ is the only prefix besides dags/ that Composer mounts into workers
      # (as /home/airflow/gcs/data). A top-level dbt/ prefix is invisible to
      # Airflow, so dbt tasks would never find the project.
      - name: Sync dbt project
        run: |
          gsutil -m rsync -r -d \
            artifacts/dbt/ \
            gs://${{ secrets.COMPOSER_BUCKET }}/data/dbt/${{ env.DOMAIN }}/

  deploy-configs-jobs:
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: needs.changes.outputs.configs_jobs == 'true'

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # No -d. TRD-002 :576 makes configs a non-destructive sync deliberately, so
      # deploying one domain cannot delete another domain's configs. Removing a
      # config is therefore an explicit `gsutil rm`, not a side effect.
      #
      # Each directory is guarded: the filter fires when EITHER configs or jobs
      # changed, but both steps run, and `rsync` hard-fails on a missing source.
      # That is what broke run 17.
      - name: Sync config files
        run: |
          if [ -d artifacts/configs ]; then
            gsutil -m rsync -r \
              artifacts/configs/ \
              gs://${{ secrets.COMPOSER_BUCKET }}/data/configs/${{ env.DOMAIN }}/
          else
            echo "artifacts/configs does not exist - nothing to sync"
          fi

      - name: Sync job files
        run: |
          if [ -d artifacts/jobs ]; then
            gsutil -m rsync -r \
              artifacts/jobs/ \
              gs://${{ secrets.COMPOSER_BUCKET }}/data/jobs/${{ env.DOMAIN }}/
          else
            echo "artifacts/jobs does not exist - nothing to sync"
          fi
