name: Deploy

on:
  push:
    branches:
      - master # Environment: dev
      - ust # Environment: ust
      - sit # Environment: sit
      - main # Environment: prod
    paths:
      - 'amf/core/**'
      - 'artifacts/configs/**'
      - 'artifacts/jobs/**'
      - 'artifacts/dags/**'
      - 'artifacts/dbt/**'
      - 'databricks.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every artifact this repo deploys is written under a prefix owned by this
  # domain, so a destructive sync can never reach another domain's files on a
  # shared Composer bucket. Matches the dags/udp/ convention in TRD-002 :569 and
  # the dags/${domain_name}/ convention already used by etp-etl-core.
  DOMAIN: udp
  # A destructive sync that would remove more than this share of the objects
  # currently in the destination prefix is treated as a bad diff, not an intent
  # to delete. See the guard in the sync jobs.
  MAX_DELETE_RATIO: 50

# Least privilege. id-token is requested so the auth step can move to Workload
# Identity Federation without restructuring this workflow; nothing here needs
# write access to repository contents.
permissions:
  contents: read
  id-token: write

# Keyed on the branch, and shared with release.yml, because both write to the
# same Composer prefixes. Queue rather than cancel: a deploy cancelled midway
# through an rsync leaves the bucket in an unknown state. `queue: max` cannot be
# combined with cancel-in-progress: true.
concurrency:
  group: composer-deploy-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}

    steps:
      - name: Resolve deployment environment
        id: set-env
        run: |
          case "${GITHUB_REF_NAME}" in
            master)
              ENVIRONMENT="dev"
              ;;
            ust)
              ENVIRONMENT="ust"
              ;;
            sit)
              ENVIRONMENT="sit"
              ;;
            main)
              ENVIRONMENT="prod"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

          echo "Resolved deployment environment: ${ENVIRONMENT}"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "### Deploying to \`${ENVIRONMENT}\` from \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

  # No `environment:` here deliberately. This job touches nothing and holds no
  # credentials, and once a required reviewer exists on an environment, every
  # job bound to it raises its own approval prompt.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10

    outputs:
      python: ${{ steps.filter.outputs.python }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deliberately NOT dorny/paths-filter. That action defaults `base` to the
      # repository default branch, so on any other branch it diffs from
      # merge-base(default, current) rather than from the previous commit. On
      # `main` that produced false positives on every run, and after an ordinary
      # merge commit it produces the opposite - zero detected changes, every
      # deploy job skipped, and a green run that deployed nothing.
      #
      # This is the estate's approach (etp-etl-core/dev.yml:63-91): diff against
      # github.event.before, with an explicit fallback. It has no fork-point
      # concept and cannot exhibit either failure.
      - name: Detect changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BEFORE}" ] \
             || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # New branch, workflow_dispatch, or a force-push that orphaned the
            # old tip. Fall back to the first parent.
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || echo "${HEAD_SHA}")"
            echo "No usable previous commit; comparing against ${BASE_SHA}"
          else
            BASE_SHA="${BEFORE}"
            echo "Comparing ${BASE_SHA}..${HEAD_SHA}"
          fi

          if [ "${BASE_SHA}" = "${HEAD_SHA}" ]; then
            CHANGED=""
          else
            CHANGED="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          echo "--- changed files ---"
          echo "${CHANGED}"
          echo "---------------------"

          has() {
            if printf '%s\n' "${CHANGED}" | grep -qE "$1"; then echo true; else echo false; fi
          }

          PY="$(has '^(amf/core/|pyproject\.toml$|uv\.lock$|databricks\.yml$)')"

          {
            echo "base_sha=${BASE_SHA}"
            echo "python=${PY}"
          } >> "$GITHUB_OUTPUT"

          # Surfaced in the summary, not buried in a collapsed log group - the
          # original defect went unnoticed for 34 runs because the diff base was
          # only visible inside ##[group].
          {
            echo "| Detection | Value |"
            echo "| --- | --- |"
            echo "| base sha | \`${BASE_SHA}\` |"
            echo "| head sha | \`${HEAD_SHA}\` |"
            echo "| rebuild wheel/image | \`${PY}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 15

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Set package version
        id: version
        run: |
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          echo "Package version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "Updated pyproject.toml:"
          grep '^version' pyproject.toml

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-wheel
          path: dist/*.whl

  deploy-artifact-registry-python:
    name: Publish wheel to Artifact Registry
    runs-on: ubuntu-latest
    needs: [setup, build-wheel]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-wheel
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: |
          python -m pip install --upgrade pip
          pip install twine keyring keyrings.google-artifactregistry-auth

      - name: Upload wheel to Artifact Registry
        env:
          TWINE_USERNAME: oauth2accesstoken
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_PYTHON_REPOSITORY }}
        run: |
          export TWINE_PASSWORD="$(gcloud auth print-access-token)"

          python -m twine upload --verbose \
            --repository-url "https://${REGION}-python.pkg.dev/${PROJECT_ID}/${REPOSITORY}/" \
            dist/*.whl

  deploy-artifact-registry-docker:
    name: Publish image to Artifact Registry
    runs-on: ubuntu-latest
    needs: [setup, build-wheel]
    timeout-minutes: 30

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: pipeline-wheel
          path: dist

      - name: Verify wheel
        run: |
          echo "Wheel used for Docker image:"
          ls -lh dist/

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            "${{ secrets.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev" --quiet

      - name: Build Docker image
        env:
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_DOCKER_REPOSITORY }}
          VERSION: ${{ needs.build-wheel.outputs.version }}
        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/amf"

          # 0.0.<run_number> carries no link back to the code that produced it,
          # so the commit sha goes on as a second tag. Without it there is no
          # way to answer "which commit is running here".
          echo "Building ${BASE}:${VERSION} (also tagged ${GITHUB_SHA})"

          docker build \
            -t "${BASE}:${VERSION}" \
            -t "${BASE}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        env:
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_DOCKER_REPOSITORY }}
          VERSION: ${{ needs.build-wheel.outputs.version }}
        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/amf"
          echo "Pushing ${BASE}:${VERSION} and ${BASE}:${GITHUB_SHA}"
          docker push "${BASE}:${VERSION}"
          docker push "${BASE}:${GITHUB_SHA}"

  # The three sync jobs below are deliberately NOT gated on `changes`.
  #
  # rsync is convergent and cheap, so gating it buys nothing, while a wrong
  # diff silently skips a deploy and still reports success. Gating is reserved
  # for the expensive wheel and image build above. This makes zero-detection
  # harmless instead of dangerous.
  deploy-dags:
    name: Sync DAGs
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Namespaced under dags/<domain>/ so the destructive -d below can only
      # ever delete this domain's DAGs. Against a shared Composer bucket an
      # un-namespaced `rsync -d` at dags/ would delete every other domain's tree.
      - name: Guard against a mass deletion
        env:
          DEST: gs://${{ secrets.COMPOSER_BUCKET }}/dags/${{ env.DOMAIN }}/
        run: |
          set -euo pipefail
          LOCAL=$(find artifacts/dags -type f | wc -l)
          REMOTE=$(gsutil ls -r "${DEST}**" 2>/dev/null | grep -c '^gs://' || true)
          echo "local=${LOCAL} remote=${REMOTE}"
          if [ "${REMOTE}" -gt 0 ] && [ "${LOCAL}" -lt $(( REMOTE * (100 - MAX_DELETE_RATIO) / 100 )) ]; then
            echo "::error::Refusing to sync: ${LOCAL} local file(s) against ${REMOTE} remote."
            echo "::error::A destructive sync would remove more than ${MAX_DELETE_RATIO}% of the destination."
            exit 1
          fi

      - name: Sync DAGs to Composer
        run: |
          gsutil -m rsync -r -d \
            artifacts/dags/ \
            gs://${{ secrets.COMPOSER_BUCKET }}/dags/${{ env.DOMAIN }}/

  deploy-dbt:
    name: Sync dbt project
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Guard against a mass deletion
        env:
          DEST: gs://${{ secrets.COMPOSER_BUCKET }}/data/dbt/${{ env.DOMAIN }}/
        run: |
          set -euo pipefail
          LOCAL=$(find artifacts/dbt -type f | wc -l)
          REMOTE=$(gsutil ls -r "${DEST}**" 2>/dev/null | grep -c '^gs://' || true)
          echo "local=${LOCAL} remote=${REMOTE}"
          if [ "${REMOTE}" -gt 0 ] && [ "${LOCAL}" -lt $(( REMOTE * (100 - MAX_DELETE_RATIO) / 100 )) ]; then
            echo "::error::Refusing to sync: ${LOCAL} local file(s) against ${REMOTE} remote."
            exit 1
          fi

      # data/ is the only prefix besides dags/ that Composer mounts into workers
      # (as /home/airflow/gcs/data). A top-level dbt/ prefix is invisible to
      # Airflow, so dbt tasks would never find the project.
      - name: Sync dbt project
        run: |
          gsutil -m rsync -r -d \
            artifacts/dbt/ \
            gs://${{ secrets.COMPOSER_BUCKET }}/data/dbt/${{ env.DOMAIN }}/

  deploy-configs-jobs:
    name: Sync configs and jobs
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # No -d. TRD-002 :576 makes configs a non-destructive sync deliberately,
      # so deploying one domain cannot delete another domain's configs. Removing
      # a config is therefore an explicit `gsutil rm`, not a side effect. No
      # deletion guard is needed here for the same reason.
      - name: Sync config files
        run: |
          if [ -d artifacts/configs ]; then
            gsutil -m rsync -r \
              artifacts/configs/ \
              gs://${{ secrets.COMPOSER_BUCKET }}/data/configs/${{ env.DOMAIN }}/
          else
            echo "artifacts/configs does not exist - nothing to sync"
          fi

      - name: Sync job files
        run: |
          if [ -d artifacts/jobs ]; then
            gsutil -m rsync -r \
              artifacts/jobs/ \
              gs://${{ secrets.COMPOSER_BUCKET }}/data/jobs/${{ env.DOMAIN }}/
          else
            echo "artifacts/jobs does not exist - nothing to sync"
          fi
