name: Deploy

# One branch per environment: dev -> DEV, prod -> PROD.
#
# This stays build-once because the version comes from the commit, not the
# branch. Fast-forwarding dev into prod carries the same commit, so it resolves
# the same version, finds the bundle already published, and deploys those exact
# bytes without rebuilding. Prod runs what dev ran because it is the same
# artifact, not a rebuild of the same source.
#
# promote.yml remains for deploying an arbitrary published version out of band,
# such as a rollback to an older one.
#
# `ust` and `sit` used to be listed here and never existed as branches; their
# case arms were unreachable. `master` and `main` are replaced by dev and prod.
on:
  push:
    branches:
      - dev
      - prod
    paths:
      - 'amf/core/**'
      - 'artifacts/configs/**'
      - 'artifacts/jobs/**'
      - 'artifacts/dags/**'
      - 'artifacts/dbt/**'
      - 'databricks.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      full_deploy:
        description: 'Reconcile every artifact instead of deploying only changed files'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every artifact this repo deploys is written under a prefix owned by this
  # domain, so a destructive sync can never reach another domain's files on a
  # shared Composer bucket. Matches the dags/udp/ convention in TRD-002 :569 and
  # the dags/${domain_name}/ convention already used by etp-etl-core.
  DOMAIN: udp
  # Not a secret - a registry name. Keeping it out of secrets means the
  # logs stay auditable instead of printing gs://*** and ***-docker.pkg.dev.
  BUNDLE_REPO: bm-udp-artifacts
  # Upper bound on deletions in a single run, enforced by deploy_artifacts.sh.
  # A larger removal is treated as a bad diff rather than an intent to delete.
  MAX_DELETIONS: 25

# Least privilege. id-token is requested so the auth step can move to Workload
# Identity Federation without restructuring this workflow; nothing here needs
# write access to repository contents.
permissions:
  contents: read
  id-token: write

# Keyed on the branch, and shared with release.yml, because both write to the
# same Composer prefixes. Queue rather than cancel: a deploy cancelled midway
# through a deploy leaves the bucket in an unknown state. `queue: max` cannot be
# combined with cancel-in-progress: true.
concurrency:
  group: composer-deploy-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}

    steps:
      - name: Resolve deployment environment
        id: set-env
        run: |
          # Branch name is the environment name. Anything else is a mistake and
          # fails loudly rather than resolving to an empty environment and
          # deploying with repository-scoped secrets.
          case "${GITHUB_REF_NAME}" in
            dev)
              ENVIRONMENT="dev"
              ;;
            prod)
              ENVIRONMENT="prod"
              ;;
            *)
              echo "::error::deploy.yml deploys only from 'dev' or 'prod'; got '${GITHUB_REF_NAME}'."
              echo "::error::To deploy a specific published version, run the Promote workflow."
              exit 1
              ;;
          esac

          echo "Resolved deployment environment: ${ENVIRONMENT}"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "### Deploying to \`${ENVIRONMENT}\` from \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

  # No `environment:` here deliberately. This job touches nothing and holds no
  # credentials, and once a required reviewer exists on an environment, every
  # job bound to it raises its own approval prompt.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10

    outputs:
      python: ${{ steps.filter.outputs.python }}
      # "full" means the diff could not be trusted, so the deploy jobs must
      # reconcile the whole directory instead of applying a change set that may
      # be empty or wrong.
      full: ${{ steps.filter.outputs.full }}
      manifest: ${{ steps.filter.outputs.manifest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deliberately NOT dorny/paths-filter. That action defaults `base` to the
      # repository default branch, so on any other branch it diffs from
      # merge-base(default, current) rather than from the previous commit. On
      # `main` that produced false positives on every run, and after an ordinary
      # merge commit it produces the opposite - zero detected changes, every
      # deploy job skipped, and a green run that deployed nothing.
      #
      # This is the estate's approach (etp-etl-core/dev.yml:63-91): diff against
      # github.event.before, with an explicit fallback. It has no fork-point
      # concept and cannot exhibit either failure.
      - name: Detect changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_FULL: ${{ inputs.full_deploy }}
        run: |
          set -euo pipefail

          FULL=false
          BASE_SHA="${HEAD_SHA}"

          if [ "${FORCE_FULL:-false}" = "true" ]; then
            FULL=true
            echo "full_deploy requested - reconciling every artifact"
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            FULL=true
            echo "No previous commit (new branch or manual run) - reconciling"
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FULL=true
            echo "Previous commit ${BEFORE} is unreachable (force-push) - reconciling"
          else
            BASE_SHA="${BEFORE}"
            echo "Comparing ${BASE_SHA}..${HEAD_SHA}"
          fi

          # -M so a rename is reported as R<score> old new, letting the deploy
          # remove the old object instead of orphaning it.
          MANIFEST=""
          if [ "${FULL}" = "false" ]; then
            MANIFEST="$(git diff --name-status -M "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          if [ "${FULL}" = "true" ]; then
            PY=true
          elif echo "${MANIFEST}" | grep -qE '^[A-Z][0-9]*[[:space:]]+(amf/core/|pyproject\.toml|uv\.lock|databricks\.yml)'; then
            PY=true
          else
            PY=false
          fi

          CHANGE_COUNT="$(echo "${MANIFEST}" | grep -c . || true)"

          echo "--- manifest ---"
          echo "${MANIFEST}"
          echo "----------------"

          {
            echo "base_sha=${BASE_SHA}"
            echo "full=${FULL}"
            echo "python=${PY}"
            echo "manifest<<MANIFEST_EOF"
            echo "${MANIFEST}"
            echo "MANIFEST_EOF"
          } >> "$GITHUB_OUTPUT"

          # Surfaced in the summary, not buried in a collapsed log group - the
          # original defect went unnoticed for 34 runs because the diff base was
          # only visible inside ##[group].
          if [ "${FULL}" = "true" ]; then MODE=full-reconciliation; else MODE=incremental; fi
          {
            echo "| Detection | Value |"
            echo "| --- | --- |"
            echo "| base sha | \`${BASE_SHA}\` |"
            echo "| head sha | \`${HEAD_SHA}\` |"
            echo "| mode | \`${MODE}\` |"
            echo "| changed files | \`${CHANGE_COUNT}\` |"
            echo "| rebuild wheel/image | \`${PY}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # One version per commit, computed once and reused by every downstream job.
  # Build-once-deploy-many needs a single identifier that names the wheel, the
  # image and the artifact bundle produced from this commit; computing it
  # separately in each job would let them drift.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10

    outputs:
      version: ${{ steps.v.outputs.version }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      bundle_version: ${{ steps.v.outputs.bundle_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Compute version
        id: v
        run: |
          set -euo pipefail
          VERSION="$(uvx --quiet --from 'setuptools-scm>=8' python -m setuptools_scm)"

          # One version, three encodings, because each registry has a different
          # charset and PEP 440's '+' is illegal in both of the others.
          #   PEP 440 / wheel : 0.1.1.dev5+gf43e9109a
          #   Docker tag      : [a-zA-Z0-9_][a-zA-Z0-9._-]*   -> '+' becomes '_'
          #   Generic AR      : lowercase, digits, '.', '-'   -> '+' becomes '-'
          # Verified against the live registry: '_' is rejected there, '-' and
          # '.' are accepted.
          IMAGE_TAG="${VERSION//+/_}"
          BUNDLE_VERSION="${VERSION//+/-}"
          BUNDLE_VERSION="${BUNDLE_VERSION//_/-}"

          {
            echo "version=${VERSION}"
            echo "image_tag=${IMAGE_TAG}"
            echo "bundle_version=${BUNDLE_VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "version ${VERSION} | image ${IMAGE_TAG} | bundle ${BUNDLE_VERSION}"
          {
            echo "| version | \`${VERSION}\` |"
            echo "| bundle version | \`${BUNDLE_VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Quality gates. Until now deploy.yml had no `needs:` on any check, so a
  # commit could deploy to the prod bucket with zero checks having run - provable
  # from the check-runs API on b55e898, d008ca4 and a7f6a63, where the only
  # check-runs are deploy.yml's own jobs.
  #
  # Same control the estate uses: etp-etl-core/dev.yml:42 gates its deploy on
  # `needs: [python-lint, sql-lint, json-lint]`.
  quality:
    name: Quality gate
    needs: setup
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  artifacts-valid:
    name: Artifact validation gate
    needs: setup
    uses: ./.github/workflows/validate-dags.yml
    permissions:
      contents: read

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [setup, changes, quality, version]
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 is required, not merely convenient: setuptools-scm derives
      # the version from the nearest tag, and a shallow clone has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build wheel
        run: uv build --wheel

      - name: Assert the wheel matches the resolved version
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          WHEEL="$(ls dist/*.whl | head -1)"
          ACTUAL="$(basename "${WHEEL}" | cut -d- -f2)"
          echo "expected ${EXPECTED}, built ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::wheel version ${ACTUAL} does not match the resolved version ${EXPECTED}"
            exit 1
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-wheel
          path: dist/*.whl

  deploy-artifact-registry-python:
    name: Publish wheel to Artifact Registry
    runs-on: ubuntu-latest
    needs: [setup, version, build-wheel]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pipeline-wheel
          path: dist

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: |
          python -m pip install --upgrade pip
          pip install twine keyring keyrings.google-artifactregistry-auth

      - name: Upload wheel to Artifact Registry
        env:
          TWINE_USERNAME: oauth2accesstoken
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_PYTHON_REPOSITORY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |

          set -euo pipefail

          # Artifact Registry rejects re-uploading an existing version, and its
          # API does not implement twine's --skip-existing (twine 7 raises
          # UnsupportedConfiguration against an AR repository). Ask the registry
          # directly instead - this is idempotent without swallowing real errors.
          if gcloud artifacts versions describe "${VERSION}" \
               --package=amf \
               --repository="${REPOSITORY}" \
               --location="${REGION}" \
               --project="${PROJECT_ID}" >/dev/null 2>&1; then
            echo "amf ${VERSION} is already published; nothing to upload."
            exit 0
          fi

          export TWINE_PASSWORD="$(gcloud auth print-access-token)"

          python -m twine upload --verbose \
            --repository-url "https://${REGION}-python.pkg.dev/${PROJECT_ID}/${REPOSITORY}/" \
            dist/*.whl

  deploy-artifact-registry-docker:
    name: Publish image to Artifact Registry
    runs-on: ubuntu-latest
    needs: [setup, version, build-wheel]
    timeout-minutes: 30

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pipeline-wheel
          path: dist

      - name: Verify wheel
        run: |
          echo "Wheel used for Docker image:"
          ls -lh dist/

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            "${{ secrets.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev" --quiet

      - name: Build Docker image
        env:
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_DOCKER_REPOSITORY }}
          VERSION: ${{ needs.version.outputs.image_tag }}
        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/amf"

          # 0.0.<run_number> carries no link back to the code that produced it,
          # so the commit sha goes on as a second tag. Without it there is no
          # way to answer "which commit is running here".
          echo "Building ${BASE}:${VERSION} (also tagged ${GITHUB_SHA})"

          docker build \
            -t "${BASE}:${VERSION}" \
            -t "${BASE}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        env:
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_DOCKER_REPOSITORY }}
          VERSION: ${{ needs.version.outputs.image_tag }}
        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/amf"
          echo "Pushing ${BASE}:${VERSION} and ${BASE}:${GITHUB_SHA}"
          docker push "${BASE}:${VERSION}"
          docker push "${BASE}:${GITHUB_SHA}"

  # Build once. artifacts/ is packaged into a single versioned bundle and
  # published to Artifact Registry, and every environment afterwards deploys
  # THAT bundle rather than a fresh checkout. Without this, each environment
  # builds its own copy from git and nothing guarantees prod runs the bytes dev
  # tested.
  #
  # Published on every commit, not only when artifacts change, so any version is
  # promotable.
  package-artifacts:
    name: Package artifact bundle
    runs-on: ubuntu-latest
    needs: [setup, version, quality, artifacts-valid]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish artifact bundle
        env:
          VERSION: ${{ needs.version.outputs.bundle_version }}
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
        run: |
          set -euo pipefail
          bash .github/scripts/publish_bundle.sh "${VERSION}"

  # The deploy jobs below take the published bundle for this version and apply
  # the manifest from `changes` file by file: only what changed is copied, only
  # what was deleted is removed.
  #
  # They consume the diff, so a wrong diff matters. That is handled at the source:
  # `changes` emits full=true whenever the diff cannot be trusted (new branch,
  # manual run, force-push), and full mode reconciles the directory instead. An
  # unreliable diff therefore over-deploys rather than silently deploying nothing.
  deploy-dags:
    name: Deploy DAGs
    runs-on: ubuntu-latest
    needs: [setup, changes, version, quality, artifacts-valid, package-artifacts]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Namespaced under dags/<domain>/ so this domain can only ever touch
      # its own DAGs on a shared Composer bucket.
      - name: Fetch the published bundle
        env:
          VERSION: ${{ needs.version.outputs.bundle_version }}
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
        run: bash .github/scripts/fetch_bundle.sh "${VERSION}" _bundle

      - name: Deploy DAGs
        env:
          # Passed as data, never interpolated into the command. A filename is
          # attacker-controllable, and `for f in ${{ ... }}` would make it code.
          MANIFEST: ${{ needs.changes.outputs.manifest }}
          MODE: ${{ needs.changes.outputs.full == 'true' && 'full' || 'incremental' }}
          DEST: gs://${{ secrets.COMPOSER_BUCKET }}/dags/${{ env.DOMAIN }}
        run: |
          echo "$MANIFEST" | bash .github/scripts/deploy_artifacts.sh _bundle/artifacts/dags "$DEST" "$MODE"

  deploy-dbt:
    name: Deploy dbt project
    runs-on: ubuntu-latest
    needs: [setup, changes, version, quality, artifacts-valid, package-artifacts]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # data/ is the only prefix besides dags/ that Composer mounts into
      # workers (as /home/airflow/gcs/data). A top-level dbt/ prefix is
      # invisible to Airflow.
      - name: Fetch the published bundle
        env:
          VERSION: ${{ needs.version.outputs.bundle_version }}
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
        run: bash .github/scripts/fetch_bundle.sh "${VERSION}" _bundle

      - name: Deploy dbt project
        env:
          # Passed as data, never interpolated into the command. A filename is
          # attacker-controllable, and `for f in ${{ ... }}` would make it code.
          MANIFEST: ${{ needs.changes.outputs.manifest }}
          MODE: ${{ needs.changes.outputs.full == 'true' && 'full' || 'incremental' }}
          DEST: gs://${{ secrets.COMPOSER_BUCKET }}/data/dbt/${{ env.DOMAIN }}
        run: |
          echo "$MANIFEST" | bash .github/scripts/deploy_artifacts.sh _bundle/artifacts/dbt "$DEST" "$MODE"

  deploy-configs:
    name: Deploy configs
    runs-on: ubuntu-latest
    needs: [setup, changes, version, quality, artifacts-valid, package-artifacts]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Fetch the published bundle
        env:
          VERSION: ${{ needs.version.outputs.bundle_version }}
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
        run: bash .github/scripts/fetch_bundle.sh "${VERSION}" _bundle

      - name: Deploy configs
        env:
          # Passed as data, never interpolated into the command. A filename is
          # attacker-controllable, and `for f in ${{ ... }}` would make it code.
          MANIFEST: ${{ needs.changes.outputs.manifest }}
          MODE: ${{ needs.changes.outputs.full == 'true' && 'full' || 'incremental' }}
          DEST: gs://${{ secrets.COMPOSER_BUCKET }}/data/configs/${{ env.DOMAIN }}
        run: |
          echo "$MANIFEST" | bash .github/scripts/deploy_artifacts.sh _bundle/artifacts/configs "$DEST" "$MODE"

  deploy-jobs:
    name: Deploy job definitions
    runs-on: ubuntu-latest
    needs: [setup, changes, version, quality, artifacts-valid, package-artifacts]
    timeout-minutes: 15

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Fetch the published bundle
        env:
          VERSION: ${{ needs.version.outputs.bundle_version }}
          REGION: ${{ secrets.ARTIFACT_REGISTRY_REGION }}
          PROJECT_ID: ${{ secrets.ARTIFACT_REGISTRY_PROJECT_ID }}
        run: bash .github/scripts/fetch_bundle.sh "${VERSION}" _bundle

      - name: Deploy job definitions
        env:
          # Passed as data, never interpolated into the command. A filename is
          # attacker-controllable, and `for f in ${{ ... }}` would make it code.
          MANIFEST: ${{ needs.changes.outputs.manifest }}
          MODE: ${{ needs.changes.outputs.full == 'true' && 'full' || 'incremental' }}
          DEST: gs://${{ secrets.COMPOSER_BUCKET }}/data/jobs/${{ env.DOMAIN }}
        run: |
          echo "$MANIFEST" | bash .github/scripts/deploy_artifacts.sh _bundle/artifacts/jobs "$DEST" "$MODE"
